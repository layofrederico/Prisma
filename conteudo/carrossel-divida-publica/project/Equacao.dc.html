<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;display=swap">
<style>
body { margin: 0; background: #01066A; }
a { color: #FFFFFF; } a:hover { color: #8ED1F5; }
@keyframes riseIn { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }
@keyframes growX { 0%, 6% { transform: scaleX(0); } 42%, 90% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
@keyframes growY { 0%, 6% { transform: scaleY(0); } 42%, 90% { transform: scaleY(1); } 100% { transform: scaleY(0); } }
@keyframes pulseDot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.3); } }
@keyframes floatY { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
@keyframes flowDash { to { stroke-dashoffset: -40; } }
@keyframes fadeCycle { 0%, 12% { opacity: 0; } 30%, 88% { opacity: 1; } 100% { opacity: 0; } }
@keyframes slideRight { 0%, 8% { transform: translateX(-14px); opacity: 0; } 35%, 92% { transform: none; opacity: 1; } 100% { transform: translateX(-14px); opacity: 0; } }
@keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
.rise { animation: riseIn 0.85s cubic-bezier(0.2, 0.7, 0.3, 1) both; }
.grow-x { transform-box: fill-box; transform-origin: left center; animation: growX 6s ease-in-out infinite; }
.grow-y { transform-box: fill-box; transform-origin: bottom center; animation: growY 6s ease-in-out infinite; }
.pulse { animation: pulseDot 2.2s ease-in-out infinite; }
.float { animation: floatY 4.5s ease-in-out infinite; }
.flow { stroke-dasharray: 10 10; animation: flowDash 1.3s linear infinite; }
.cycle { animation: fadeCycle 6s ease-in-out infinite; }
.slide-r { animation: slideRight 6s ease-in-out infinite; }
.breathe { animation: breathe 3.4s ease-in-out infinite; }
</style>
</helmet>
<div style="width: 1080px; height: 1350px; box-sizing: border-box; padding: 60px 84px 56px; background: #01066A; color: #FFFFFF; font-family: 'Poppins', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; text-align: center;">
  <div style="display: flex; flex-direction: column; align-items: center; gap: 13px;">

    <div style="width: 169px; height: 10px; border-radius: 999px; background: linear-gradient(90deg, #F5A3C7 0%, #F7DE8B 34%, #9FE7C4 66%, #8ED1F5 100%);"></div>

    <h1 class="rise" style="margin: 0; font-size: 56px; font-weight: 700; line-height: 1.07; letter-spacing: -0.02em;">A União criou um<br>fundo para cobrir<br>essa perda</h1>

      <rect x="300" y="8" width="280" height="86" rx="18" fill="none" stroke="rgba(255,255,255,0.26)" stroke-width="3"></rect>
      <text x="440" y="60" font-family="Poppins, sans-serif" font-size="30" font-weight="600" fill="#FFFFFF" text-anchor="middle">Seu benefício</text>
      <path class="flow" d="M440 94 L440 128 L180 128 L180 168" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="3"></path>
      <path class="flow" style="animation-delay: 0.4s" d="M440 94 L440 128 L700 128 L700 168" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="3"></path>
      <rect x="20" y="168" width="320" height="168" rx="18" fill="rgba(21,155,112,0.18)" stroke="#159B70" stroke-width="3"></rect>
      <text x="180" y="212" font-family="Poppins, sans-serif" font-size="28" font-weight="700" fill="#159B70" text-anchor="middle">ONEROSO</text>
      <text x="180" y="254" font-family="Poppins, sans-serif" font-size="25" font-weight="500" fill="#FFFFFF" text-anchor="middle">prazo certo</text>
      <text x="180" y="288" font-family="Poppins, sans-serif" font-size="25" font-weight="500" fill="#FFFFFF" text-anchor="middle">+ contrapartida</text>
      <text x="180" y="322" font-family="Poppins, sans-serif" font-size="24" font-weight="500" fill="rgba(255,255,255,0.78)" text-anchor="middle">entra no fundo</text>
      <rect x="540" y="168" width="320" height="168" rx="18" fill="rgba(222,58,118,0.18)" stroke="#DE3A76" stroke-width="3"></rect>
      <text x="700" y="212" font-family="Poppins, sans-serif" font-size="28" font-weight="700" fill="#DE3A76" text-anchor="middle">SEM PRAZO</text>
      <text x="700" y="254" font-family="Poppins, sans-serif" font-size="25" font-weight="500" fill="#FFFFFF" text-anchor="middle">sem condição</text>
      <text x="700" y="288" font-family="Poppins, sans-serif" font-size="25" font-weight="500" fill="#FFFFFF" text-anchor="middle">no ato</text>
      <text x="700" y="322" font-family="Poppins, sans-serif" font-size="24" font-weight="500" fill="rgba(255,255,255,0.78)" text-anchor="middle">não recebe nada</text>
    </svg>
    <p style="margin: 0; max-width: 840px; font-size: 21px; line-height: 1.4; color: rgba(255,255,255,0.56);">Fundo de Compensação de Benefícios Fiscais: art. 12 da EC nº 132/2023 e arts. 384 a 405 da LC nº 214/2025.</p>
  </div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 14px;">
    <div style="width: 169px; height: 10px; border-radius: 999px; background: linear-gradient(90deg, #F5A3C7 0%, #F7DE8B 34%, #9FE7C4 66%, #8ED1F5 100%);"></div>

  </div>
</div>
