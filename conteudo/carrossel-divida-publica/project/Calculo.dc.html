<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;display=swap">
<style>
body { margin: 0; background: #01066A; }
a { color: #FFFFFF; } a:hover { color: #8ED1F5; }
@keyframes riseIn { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }
@keyframes growX { 0%, 6% { transform: scaleX(0); } 42%, 90% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
@keyframes growY { 0%, 6% { transform: scaleY(0); } 42%, 90% { transform: scaleY(1); } 100% { transform: scaleY(0); } }
@keyframes pulseDot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.3); } }
@keyframes floatY { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
@keyframes flowDash { to { stroke-dashoffset: -40; } }
@keyframes fadeCycle { 0%, 12% { opacity: 0; } 30%, 88% { opacity: 1; } 100% { opacity: 0; } }
@keyframes slideRight { 0%, 8% { transform: translateX(-14px); opacity: 0; } 35%, 92% { transform: none; opacity: 1; } 100% { transform: translateX(-14px); opacity: 0; } }
@keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
.rise { animation: riseIn 0.85s cubic-bezier(0.2, 0.7, 0.3, 1) both; }
.grow-x { transform-box: fill-box; transform-origin: left center; animation: growX 6s ease-in-out infinite; }
.grow-y { transform-box: fill-box; transform-origin: bottom center; animation: growY 6s ease-in-out infinite; }
.pulse { animation: pulseDot 2.2s ease-in-out infinite; }
.float { animation: floatY 4.5s ease-in-out infinite; }
.flow { stroke-dasharray: 10 10; animation: flowDash 1.3s linear infinite; }
.cycle { animation: fadeCycle 6s ease-in-out infinite; }
.slide-r { animation: slideRight 6s ease-in-out infinite; }
.breathe { animation: breathe 3.4s ease-in-out infinite; }
</style>
</helmet>
<div style="width: 1080px; height: 1350px; box-sizing: border-box; padding: 60px 84px 56px; background: #01066A; color: #FFFFFF; font-family: 'Poppins', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; text-align: center;">
  <div style="display: flex; flex-direction: column; align-items: center; gap: 13px;">
    <span style="font-size: 22px; font-weight: 600; letter-spacing: 0.44em;">PRISMA CONTÁBIL</span>
    <div style="width: 169px; height: 10px; border-radius: 999px; background: linear-gradient(90deg, #F5A3C7 0%, #F7DE8B 34%, #9FE7C4 66%, #8ED1F5 100%);"></div>

    <svg viewBox="0 0 880 450" width="880" height="450" role="img" xmlns="http://www.w3.org/2000/svg">
      <rect x="10" y="10" width="860" height="78" rx="14" fill="none" stroke="rgba(255,255,255,0.26)" stroke-width="3"></rect>
      <text x="440.0" y="60" font-family="Poppins, sans-serif" font-size="27" font-weight="500" fill="#FFFFFF" text-anchor="middle">Tem prazo certo e contrapartida?</text>
      <path class="flow" d="M440 88 L440 120" stroke="rgba(255,255,255,0.14)" stroke-width="3"></path>
      <path d="M428 110 L440 122 L452 110" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="3"></path>
      <rect x="60" y="120" width="660" height="78" rx="14" fill="none" stroke="rgba(255,255,255,0.26)" stroke-width="3"></rect>
      <text x="390.0" y="170" font-family="Poppins, sans-serif" font-size="27" font-weight="500" fill="#FFFFFF" text-anchor="middle">Concedido regularmente até 31/05/2023?</text>
      <path class="flow" d="M440 198 L440 230" stroke="rgba(255,255,255,0.14)" stroke-width="3"></path>
      <path d="M428 220 L440 232 L452 220" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="3"></path>
      <rect x="110" y="230" width="460" height="78" rx="14" fill="none" stroke="rgba(255,255,255,0.26)" stroke-width="3"></rect>
      <text x="340.0" y="280" font-family="Poppins, sans-serif" font-size="27" font-weight="500" fill="#FFFFFF" text-anchor="middle">Habilitou-se no prazo?</text>
      <rect x="230" y="346" width="420" height="86" rx="14" fill="rgba(21,155,112,0.18)" stroke="#159B70" stroke-width="3"></rect>
      <text x="440" y="398" font-family="Poppins, sans-serif" font-size="30" font-weight="700" fill="#159B70" text-anchor="middle">recebe compensação</text>
    </svg>
    <p class="rise" style="margin: 0; max-width: 840px; font-size: 34px; font-weight: 600; line-height: 1.34; animation-delay: 0.25s;">Falhou em um, perde o benefício sem receber nada.</p>
  </div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 14px;">
    <div style="width: 169px; height: 10px; border-radius: 999px; background: linear-gradient(90deg, #F5A3C7 0%, #F7DE8B 34%, #9FE7C4 66%, #8ED1F5 100%);"></div>
    <span style="font-size: 38px; font-weight: 600;">@prismacontabilto</span>
  </div>
</div>
