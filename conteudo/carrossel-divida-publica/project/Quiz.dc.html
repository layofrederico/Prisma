<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Teste: seu benefício fiscal entra no Fundo de Compensação?</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;display=swap">
<style>
body { margin: 0; background: #01066A; }
a { color: #FFFFFF; } a:hover { color: #8ED1F5; }
@keyframes riseIn { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }
@keyframes pulseDot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.3); } }
@keyframes floatY { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
.rise { animation: riseIn 0.6s cubic-bezier(0.2, 0.7, 0.3, 1) both; }
.pulse { animation: pulseDot 2.2s ease-in-out infinite; }
.float { animation: floatY 4.5s ease-in-out infinite; }
button { font-family: 'Poppins', sans-serif; cursor: pointer; transition: transform 0.15s ease, background 0.15s ease; }
button:hover { transform: translateY(-3px); }
</style>
</helmet>
<div style="width: 1080px; height: 1350px; box-sizing: border-box; padding: 60px 84px 56px; background: #01066A; color: #FFFFFF; font-family: 'Poppins', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; text-align: center;">

  <div style="display: flex; flex-direction: column; align-items: center; gap: 13px;">
    <span style="font-size: 22px; font-weight: 600; letter-spacing: 0.44em;">PRISMA CONTÁBIL</span>
    <div style="width: 169px; height: 10px; border-radius: 999px; background: linear-gradient(90deg, #F5A3C7 0%, #F7DE8B 34%, #9FE7C4 66%, #8ED1F5 100%);"></div>
  </div>

  <div style="flex-grow: 1; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px;">

    <sc-if value="{{ naPergunta }}" hint-placeholder-val="{{ true }}">
      <div style="width: 100%; display: flex; flex-direction: column; align-items: center; gap: 36px;">
        <div style="display: flex; gap: 14px;">
          <span style="width: 60px; height: 8px; border-radius: 999px; background: {{ passo1 }};"></span>
          <span style="width: 60px; height: 8px; border-radius: 999px; background: {{ passo2 }};"></span>
          <span style="width: 60px; height: 8px; border-radius: 999px; background: {{ passo3 }};"></span>
        </div>
        <span style="font-size: 26px; font-weight: 600; letter-spacing: 0.24em; color: rgba(255,255,255,0.56);">{{ contador }}</span>
        <h1 style="margin: 0; max-width: 880px; font-size: 58px; font-weight: 700; line-height: 1.12; letter-spacing: -0.02em;">{{ pergunta }}</h1>
        <p style="margin: 0; max-width: 800px; font-size: 27px; line-height: 1.42; color: rgba(255,255,255,0.72);">{{ ajuda }}</p>
        <div style="display: flex; gap: 26px; margin-top: 10px;">
          <button onClick="{{ responderSim }}" style="background: #FFFFFF; color: #01066A; border: none; font-size: 36px; font-weight: 700; padding: 26px 76px; border-radius: 999px;">Sim</button>
          <button onClick="{{ responderNao }}" style="background: transparent; color: #FFFFFF; border: 3px solid rgba(255,255,255,0.4); font-size: 36px; font-weight: 700; padding: 23px 73px; border-radius: 999px;">Não</button>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{ noResultado }}" hint-placeholder-val="{{ false }}">
      <div class="rise" style="width: 100%; display: flex; flex-direction: column; align-items: center; gap: 30px;">
        <div class="float" style="width: 150px; height: 150px; border-radius: 999px; background: {{ corFundo }}; border: 4px solid {{ cor }}; display: flex; align-items: center; justify-content: center;">
          <span style="font-size: 72px; font-weight: 800; color: {{ cor }};">{{ marca }}</span>
        </div>
        <h1 style="margin: 0; max-width: 880px; font-size: 56px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; color: {{ cor }};">{{ titulo }}</h1>
        <p style="margin: 0; max-width: 820px; font-size: 30px; line-height: 1.44; color: rgba(255,255,255,0.86);">{{ texto }}</p>
        <div style="max-width: 820px; border: 2px solid rgba(255,255,255,0.26); border-radius: 20px; padding: 28px 34px;">
          <p style="margin: 0; font-size: 25px; line-height: 1.4; color: rgba(255,255,255,0.78);">{{ proximo }}</p>
        </div>
        <div style="display: flex; gap: 22px; align-items: center; margin-top: 6px;">
          <a href="https://www.instagram.com/prismacontabilto" style="background: #FFFFFF; color: #01066A; font-size: 32px; font-weight: 700; text-decoration: none; padding: 24px 52px; border-radius: 999px;">Falar com um contador</a>
          <button onClick="{{ reiniciar }}" style="background: transparent; color: rgba(255,255,255,0.78); border: 3px solid rgba(255,255,255,0.3); font-size: 28px; font-weight: 600; padding: 21px 40px; border-radius: 999px;">Refazer</button>
        </div>
      </div>
    </sc-if>

  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 14px;">
    <div style="width: 169px; height: 10px; border-radius: 999px; background: linear-gradient(90deg, #F5A3C7 0%, #F7DE8B 34%, #9FE7C4 66%, #8ED1F5 100%);"></div>
    <span style="font-size: 38px; font-weight: 600;">@prismacontabilto</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  // Triagem de onerosidade do benefício para fins do Fundo de Compensação
  // (art. 12 da EC 132/2023; arts. 384 a 405 da LC 214/2025).
  constructor(props) {
    super(props);
    this.state = { etapa: 0, reprovou: false };
  }

  get perguntas() {
    return [
      {
        titulo: 'O ato que concedeu seu benefício tem prazo certo de vigência?',
        ajuda: 'Procure no TARE, no termo de acordo ou na lei estadual uma data final de fruição. Benefício por tempo indeterminado não é oneroso.'
      },
      {
        titulo: 'Ele exige alguma contrapartida sua?',
        ajuda: 'Investimento, geração de emprego, manutenção da operação no estado, faturamento mínimo. Precisa estar escrita no ato como condição.'
      },
      {
        titulo: 'Foi concedido de forma regular até 31/05/2023?',
        ajuda: 'Benefício instituído ou renovado depois dessa data fica fora do Fundo, mesmo sendo oneroso.'
      }
    ];
  }

  avancar(resposta) {
    const reprovou = this.state.reprovou || !resposta;
    const etapa = this.state.etapa + 1;
    this.setState({ etapa: etapa, reprovou: reprovou });
  }

  renderVals() {
    const total = this.perguntas.length;
    const etapa = this.state.etapa;
    const naPergunta = etapa < total;
    const atual = naPergunta ? this.perguntas[etapa] : this.perguntas[total - 1];
    const aprovado = !this.state.reprovou;
    const rosa = '#DE3A76';
    const verde = '#159B70';
    const apagado = 'rgba(255,255,255,0.22)';

    return {
      naPergunta: naPergunta,
      noResultado: !naPergunta,
      contador: 'PERGUNTA ' + Math.min(etapa + 1, total) + ' DE ' + total,
      pergunta: atual.titulo,
      ajuda: atual.ajuda,
      passo1: etapa >= 0 ? '#FFFFFF' : apagado,
      passo2: etapa >= 1 ? '#FFFFFF' : apagado,
      passo3: etapa >= 2 ? '#FFFFFF' : apagado,
      responderSim: () => this.avancar(true),
      responderNao: () => this.avancar(false),
      reiniciar: () => this.setState({ etapa: 0, reprovou: false }),
      cor: aprovado ? verde : rosa,
      corFundo: aprovado ? 'rgba(21,155,112,0.18)' : 'rgba(222,58,118,0.18)',
      marca: aprovado ? '✓' : '!',
      titulo: aprovado
        ? 'Seu benefício tem cara de oneroso'
        : 'Seu benefício provavelmente fica de fora',
      texto: aprovado
        ? 'Pelos três critérios, ele tende a se enquadrar no Fundo de Compensação. O que falta é a habilitação — e ela tem prazo: 31/12/2028.'
        : 'Faltou pelo menos um dos requisitos. Sem eles não há compensação: entre 2029 e 2032 o benefício encolhe junto com o ICMS e nada entra no lugar.',
      proximo: aprovado
        ? 'Próximo passo: reunir o ato de concessão e a prova de cumprimento da condição, e protocolar a habilitação antes que a fila aperte.'
        : 'Próximo passo: reestruturar antes de 2029 — revisar preço, margem e, quando couber, negociar novo enquadramento com prazo e contrapartida.'
    };
  }
}
</script>
</body>
</html>
