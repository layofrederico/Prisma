<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Story — novo comprovante do CNPJ</title>
<link rel="stylesheet" href="../../carrossel-divida-publica/video/poppins-local.css">
<style>
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #01066A; }
body { font-family: 'Poppins', sans-serif; color: #FFFFFF; }
@keyframes riseIn { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
@keyframes floatY { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-14px) rotate(-4deg); } }
@keyframes pulseDot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(1.3); } }
@keyframes nudgeY { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(12px); } }
@keyframes nudgeX { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(14px); } }
.rise { animation: riseIn 0.85s cubic-bezier(0.2, 0.7, 0.3, 1) both; }
.float { animation: floatY 4.5s ease-in-out infinite; }
.pulse { animation: pulseDot 2.2s ease-in-out infinite; }
.desce { display: inline-block; animation: nudgeY 1.6s ease-in-out infinite; }
.lado { display: inline-block; animation: nudgeX 1.6s ease-in-out infinite; }
.faixa { width: 169px; height: 9px; border-radius: 999px; background: linear-gradient(90deg, #F5A3C7 0%, #F7DE8B 34%, #9FE7C4 66%, #8ED1F5 100%); }
#tela { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; text-align: center; }
/* zonas: 0–220 e 1720–1920 ficam livres para a interface do Instagram */
#topo { margin-top: 240px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
#kicker { margin-top: 44px; font-size: 28px; font-weight: 600; letter-spacing: 0.24em; color: rgba(255,255,255,0.72); display: inline-flex; align-items: center; gap: 14px; }
h1 { margin: 18px 0 0; font-size: 82px; font-weight: 800; line-height: 1.06; letter-spacing: -0.02em; }
#doc { margin-top: 44px; background: #FFFFFF; padding: 12px; border-radius: 16px; box-shadow: 0 24px 60px rgba(0,0,0,0.4); }
#doc img { display: block; width: 330px; height: 465px; }
#ref { margin-top: 26px; font-size: 24px; color: rgba(255,255,255,0.6); }
#chamada { margin-top: 34px; font-size: 36px; font-weight: 700; }
#enquete { position: absolute; left: 140px; top: 1365px; width: 800px; height: 250px; }
#guia { display: none; position: absolute; inset: 0; border: 4px dashed rgba(255,255,255,0.75); border-radius: 36px; align-items: center; justify-content: center; flex-direction: column; gap: 8px; font-size: 30px; font-weight: 600; }
body.guia #guia { display: flex; }
#rodape { position: absolute; left: 0; right: 0; top: 1650px; text-align: center; font-size: 30px; font-weight: 600; color: rgba(255,255,255,0.85); }
.desce, .lado { font-size: 1.3em; line-height: 1; font-weight: 700; }
</style></head>
<body>
<div id="tela">
  <div id="topo"><span style="font-size: 24px; font-weight: 600; letter-spacing: 0.44em;">PRISMA CONTÁBIL</span><div class="faixa"></div></div>
  <div id="kicker" class="rise" style="animation-delay: .2s;"><span class="pulse" style="width: 14px; height: 14px; border-radius: 999px; background: #F5A3C7;"></span>NOVO REELS NO PERFIL</div>
  <h1 class="rise" style="animation-delay: .35s;">Você já viu o novo<br>comprovante<br>do CNPJ?</h1>
  <div class="rise" style="animation-delay: .6s;"><div id="doc" class="float"><img src="../anexo/anexo-modelo1.jpg" alt="Modelo I do novo comprovante do CNPJ"></div></div>
  <div id="ref" class="rise" style="animation-delay: .8s;">Modelo I · Anexo Único da IN RFB nº 2.345/2026</div>
  <div id="chamada" class="rise" style="animation-delay: 1s;">Responda <span class="desce">&#8595;</span></div>
</div>
<div id="enquete"><div id="guia"><span>Enquete do Instagram aqui</span><span style="font-size: 26px; font-weight: 500; opacity: 0.85;">“Sim, já vi” · “Ainda não”</span></div></div>
<div id="rodape" class="rise" style="animation-delay: 1.3s;">No próximo story, o Reel completo <span class="lado">&#8594;</span></div>
<script>
window.__holes = {};
window.__setTime = function (t) {
  document.getAnimations().forEach(function (a) { a.pause(); a.currentTime = t * 1000; });
};
</script>
</body></html>
